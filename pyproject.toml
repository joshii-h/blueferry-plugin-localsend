[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueferry-localsend"
version = "0.1.2"
description = "BlueFerry plugin: send and receive files with LocalSend devices, natively"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
# dbus-python and PyGObject come from the distribution (BlueFerry creates the
# plugin's venv with --system-site-packages). The kit brings the hardened LAN
# server, interface choice and owner-only files. cryptography only creates
# the self-signed certificate once; tls.py imports it directly, so it stays
# a direct dependency even though the kit's lanserver extra pulls it in too.
dependencies = [
  "blueferry-plugin-api @ git+https://github.com/joshii-h/blueferry@plugin-api-v1.2.0#subdirectory=plugin-api",
  "blueferry-plugin-kit[lanserver] @ git+https://github.com/joshii-h/blueferry-plugin-kit@kit-v0.1.0",
  "cryptography>=41,<51",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "ruff>=0.5,<1"]

[project.urls]
Homepage = "https://github.com/joshii-h/blueferry-plugin-localsend"
Source = "https://github.com/joshii-h/blueferry-plugin-localsend"

[project.scripts]
blueferry-localsend = "blueferry_localsend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blueferry_localsend" = ["*.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B904", "RUF005", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["blueferry_localsend"]
known-third-party = ["blueferry", "blueferry_plugin_kit"]
